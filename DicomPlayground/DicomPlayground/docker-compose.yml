services:
  orthanc:
    image: orthancteam/orthanc
    ports:
      - "4242:4242"
      - "8042:8042"

    volumes:
      - orthanc-db:/var/lib/orthanc/db
      - ./orthanc.json:/etc/orthanc/orthanc.json

    environment:
      ORTHANC__NAME: "TestOrthanc"
      ORTHANC__DICOM_AET: "ORTHANC"

volumes:
  orthanc-db: